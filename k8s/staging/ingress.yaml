apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: abi-isp-be
  namespace: abi-isp-staging
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: "abi-isp-be.k3s.bangun-kreatif.com"
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: abi-isp-be
                port:
                  number: 5000
  tls:
    - hosts:
        - "abi-isp-be.k3s.bangun-kreatif.com"
      secretName: abi-isp-be-k3s-bangun-kreatif-com-tls
