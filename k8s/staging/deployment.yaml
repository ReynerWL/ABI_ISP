apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-mbinet
  namespace: mbinet-prod
spec:
  selector:
    matchLabels:
      app: api-mbinet
  replicas: 1
  template:
    metadata:
      labels:
        app: api-mbinet
    spec:
      containers:
        - name: api-mbinet
          image: registry.empatnusabangsa.com/empatnusabangsa/mbinet-be:<VERSION>
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: api-mbinet-env
      imagePullSecrets:
        - name: regcred

